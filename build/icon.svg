<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 576">
  <!-- 十二阅读 应用图标 · A 方向：宋体字标 + 朱红书签（带投影，四角透明） -->
  <!-- 授权说明：「十二」字形来自思源宋体（Noto Serif SC，OFL），成品为位图/轮廓，不内嵌字体文件 -->
  <!-- 画布 576：图标本体 504（36..540 / 32..536），四周留边给投影与抗锯齿；本体外的区域必须透明 -->
  <defs>
    <clipPath id="tile">
      <rect x="36" y="32" width="504" height="504" rx="100"/>
    </clipPath>
    <filter id="ds" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3A3630" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect x="36" y="32" width="504" height="504" rx="100" fill="#F6F3EC" filter="url(#ds)"/>
  <g clip-path="url(#tile)">
    <path d="M404 32 L482 32 L482 180 L443 148 L404 180 Z" fill="#B23B2E"/>
  </g>
  <text x="280" y="366" text-anchor="middle"
        font-family="'Noto Serif SC VF', 'Noto Serif SC', serif"
        font-size="187" font-weight="700" fill="#2B2A26">十二</text>
</svg>

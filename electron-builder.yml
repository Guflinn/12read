appId: com.twelve.read
productName: 十二阅读
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - node_modules/**
  - '!**/*.map'
  # pdfjs 的可选依赖，带着 skia 原生模块：在 Electron 里加载会崩（BEX64），
  # 而我们只抽文字用不到它（见 src/main/services/pdf/import.ts 的 blockCanvasNative）。
  - '!**/@napi-rs/**'
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
# 应用内更新（0.4.0）：有了这一节，打包时才会生成 resources/app-update.yml（客户端据此找更新源）
# 与输出目录里的 latest.yml / *.blockmap（后者支持差量更新，安装时要一并传到 Release）。
publish:
  provider: github
  owner: Guflinn
  repo: 12read
  releaseType: prerelease
# better-sqlite3 13 提供 N-API prebuild，打包时无需 node-gyp 重编译
npmRebuild: false
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  # 产物名必须保持 ASCII：**GitHub 会把附件名里的非 ASCII 字符直接删掉**
  # （实测：`安装包-0.4.0.exe` → `-0.4.0.exe`、`测试中文名.txt` → `default.txt`），
  # 而 latest.yml 里的 path 必须与远端附件名逐字一致，否则应用内更新找不到包。
  # electron-builder 也是因为这个，对 GitHub 源会自动把最新版元数据里的名字换成
  # 「安全名」（见 node_modules/app-builder-lib/out/publish/updateInfoBuilder.js）。
  # 想要中文文件名：下载后自己重命名即可，改名不影响运行（免安装版实测过中文名能正常起）。
  artifactName: twelve-read-setup-${version}.exe
portable:
  # 免安装版：单文件 exe，双击即跑
  artifactName: twelve-read-portable-${version}.exe
mac:
  target:
    - dmg
  category: public.app-category.books
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
